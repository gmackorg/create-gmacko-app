name: CLI E2E Tests

on:
  # Run on release branches
  push:
    branches:
      - main
      - release/*
    paths:
      - "packages/create-gmacko-app/**"
      - ".github/workflows/cli-e2e.yml"
  # Allow manual trigger
  workflow_dispatch:
    inputs:
      keep_test_apps:
        description: "Keep test apps for debugging"
        type: boolean
        default: false
  # Run nightly
  schedule:
    - cron: "0 2 * * *" # 2 AM UTC daily

concurrency:
  group: cli-e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  # Scaffold from this checkout instead of cloning main, so template changes in
  # the branch under test are actually exercised (the CLI defaults to cloning
  # https://github.com/gmackorg/create-gmacko-app.git otherwise).
  CREATE_GMACKO_APP_TEMPLATE_REPO: ${{ github.workspace }}
  # The mock .env every scaffold gets. It mirrors .env.example: the web lane
  # reads these as Worker bindings (no database URL, the database is a local
  # D1), Expo reads EXPO_PUBLIC_*, the operator lane reads GMACKO_API_*.
  MOCK_ENV: |
    STAGE="development"
    APP_URL="http://localhost:3001"
    AUTH_SECRET="test-secret-key-for-testing-only-32-chars"
    AUTH_GITHUB_ID="test-github-client-id"
    AUTH_GITHUB_SECRET="test-github-client-secret"
    AUTH_GOOGLE_ID="test-google-client-id"
    AUTH_GOOGLE_SECRET="test-google-client-secret"
    BYPASS_MAGIC_LINK="true"
    VITE_POSTHOG_HOST="https://us.i.posthog.com"
    EXPO_PUBLIC_POSTHOG_HOST="https://us.i.posthog.com"
    EXPO_PUBLIC_POSTHOG_KEY_DEV="phc_test_dev"
    EXPO_PUBLIC_POSTHOG_KEY_STAGING="phc_test_staging"
    EXPO_PUBLIC_POSTHOG_KEY_PROD="phc_test_prod"
    EXPO_PUBLIC_SENTRY_DSN_DEV="https://test@example.ingest.sentry.io/123"
    EXPO_PUBLIC_SENTRY_DSN_STAGING="https://test@example.ingest.sentry.io/456"
    EXPO_PUBLIC_SENTRY_DSN_PROD="https://test@example.ingest.sentry.io/789"
    CLOUDFLARE_ACCOUNT_ID="test-cloudflare-account"
    CLOUDFLARE_API_TOKEN="test-cloudflare-token"
    GMACKO_API_URL="http://localhost:3001"
    GMACKO_API_KEY="test-gmacko-api-key"

jobs:
  build-cli:
    name: Build CLI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build CLI
        run: pnpm --dir packages/create-gmacko-app build

      - name: Upload CLI dist
        uses: actions/upload-artifact@v4
        with:
          name: cli-dist
          path: packages/create-gmacko-app/dist
          retention-days: 1

  e2e-default:
    name: E2E - Default (web + mobile)
    needs: build-cli
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download CLI dist
        uses: actions/download-artifact@v4
        with:
          name: cli-dist
          path: packages/create-gmacko-app/dist

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install CLI dependencies
        run: pnpm install --frozen-lockfile

      - name: Scaffold app
        run: |
          mkdir -p /tmp/e2e-test
          cd /tmp/e2e-test
          node ${{ github.workspace }}/packages/create-gmacko-app/dist/index.js test-app-default \
            --yes --no-git
        env:
          CI: "true"

      - name: Create mock .env
        run: printf '%s' "$MOCK_ENV" > .env
        working-directory: /tmp/e2e-test/test-app-default

      - name: Run doctor
        run: |
          pnpm run doctor | tee /tmp/e2e-test/default-doctor.log
          grep 'Cloudflare Workers lane detected' /tmp/e2e-test/default-doctor.log || (echo "Doctor did not detect the Workers lane" && exit 1)
          grep 'Cloudflare Workers env values' /tmp/e2e-test/default-doctor.log || (echo "Doctor did not report the Cloudflare env group" && exit 1)
        working-directory: /tmp/e2e-test/test-app-default

      - name: Validate ForgeGraph metadata
        run: |
          grep 'app: test-app-default' .forgegraph.yaml || (echo "Missing ForgeGraph app name" && exit 1)
          grep 'type: d1' .forgegraph.yaml || (echo "Missing D1 database contract" && exit 1)
          grep 'platform: cloudflare-workers' .forgegraph.yaml || (echo "Missing cloudflare-workers target" && exit 1)
          grep 'workerName: test-app-default-web-staging' .forgegraph.yaml || (echo "Missing staging Worker name" && exit 1)
          grep '# healthcheck path: /.well-known/forge-health' .forgegraph.yaml || (echo "Missing ForgeGraph healthcheck note" && exit 1)
          grep '# preview domain: change-me.preview.example.com' .forgegraph.yaml || (echo "Missing ForgeGraph preview domain placeholder" && exit 1)
          grep '# production domain: change-me.example.com' .forgegraph.yaml || (echo "Missing ForgeGraph production domain placeholder" && exit 1)
          grep '"name": "test-app-default-web"' apps/web/wrangler.jsonc || (echo "Worker not renamed after the app" && exit 1)
        working-directory: /tmp/e2e-test/test-app-default

      - name: Verify local forge CLI resolution
        run: |
          pnpm exec forge version | tee /tmp/e2e-test/forge-version.log
          grep -E 'forge [0-9]+\.' /tmp/e2e-test/forge-version.log || (echo "Local forge CLI did not resolve from repo install" && exit 1)
        working-directory: /tmp/e2e-test/test-app-default

      - name: Smoke ForgeGraph scripts
        # Verify the forge:* scripts are wired to the right forge commands. (A
        # runtime fake-forge-on-PATH check doesn't work: pnpm resolves the real
        # forge from node_modules/.bin first, so the fake is never invoked.)
        run: |
          grep 'forge stage list' package.json || (echo "forge:stages not wired to 'forge stage list'" && exit 1)
          grep 'forge deploy create staging --wait' package.json || (echo "forge:deploy:staging not wired to 'forge deploy create staging --wait'" && exit 1)
        working-directory: /tmp/e2e-test/test-app-default

      - name: Run auth and db bootstrap commands
        run: |
          pnpm auth:generate
          pnpm db:generate
          pnpm db:check
          test -f packages/db/.cache/auth-schema.generated.ts || (echo "Auth schema output missing after bootstrap commands" && exit 1)
          grep -q "hand-maintained" packages/db/src/auth-schema.ts || (echo "auth:generate overwrote the committed auth schema" && exit 1)
          ls packages/db/migrations/*.sql >/dev/null || (echo "No D1 migrations after db:generate" && exit 1)
        working-directory: /tmp/e2e-test/test-app-default

      - name: Migrate and seed the local D1, run the Workers tests
        run: |
          pnpm db:migrate:local
          pnpm db:seed
          pnpm test:workers
        working-directory: /tmp/e2e-test/test-app-default

      - name: Run fast checks
        run: pnpm check:fast
        working-directory: /tmp/e2e-test/test-app-default

      - name: Run web build
        run: pnpm --filter @gmacko/web build
        working-directory: /tmp/e2e-test/test-app-default

      - name: Smoke the migrate-then-deploy stage script
        # scripts/deploy-stage.mjs applies the D1 migrations and then deploys
        # the Worker. Replace the resolved wrangler bin(s) with a fake (pnpm
        # prepends node_modules/.bin, which shadows anything on PATH) and
        # assert the sequence reaches `wrangler deploy` without Cloudflare
        # credentials. Runs after the real web build so `vite build` is warm.
        run: |
          set -o pipefail
          for w in $(find . -path '*/node_modules/.bin/wrangler'); do
            rm -f "$w"
            printf '#!/bin/sh\necho "fake-wrangler $@"\n' > "$w"
            chmod +x "$w"
          done
          pnpm deploy:staging | tee /tmp/e2e-test/deploy-staging.log
          grep 'fake-wrangler d1 migrations apply' /tmp/e2e-test/deploy-staging.log || (echo "deploy:staging did not apply D1 migrations first" && exit 1)
          grep 'fake-wrangler deploy' /tmp/e2e-test/deploy-staging.log || (echo "deploy:staging did not reach wrangler deploy" && exit 1)
        working-directory: /tmp/e2e-test/test-app-default

  e2e-operators:
    name: E2E - Operator Lane
    needs: build-cli
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download CLI dist
        uses: actions/download-artifact@v4
        with:
          name: cli-dist
          path: packages/create-gmacko-app/dist

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install CLI dependencies
        run: pnpm install --frozen-lockfile

      - name: Scaffold operator app
        run: |
          mkdir -p /tmp/e2e-test
          cd /tmp/e2e-test
          node ${{ github.workspace }}/packages/create-gmacko-app/dist/index.js test-app-operators \
            --yes --no-git --no-mobile --saas-bootstrap --operator-lane
        env:
          CI: "true"

      - name: Create mock .env
        run: printf '%s' "$MOCK_ENV" > .env
        working-directory: /tmp/e2e-test/test-app-operators

      - name: Run doctor
        run: |
          pnpm run doctor | tee /tmp/e2e-test/operator-doctor.log
          grep 'Operator API lane detected' /tmp/e2e-test/operator-doctor.log || (echo "Doctor did not detect operator lane" && exit 1)
          grep 'Operator API env values' /tmp/e2e-test/operator-doctor.log || (echo "Doctor did not check operator env values" && exit 1)
        working-directory: /tmp/e2e-test/test-app-operators

      - name: Smoke operator CLI help
        run: |
          # pipefail so a failing api:ops fails the step (tee would otherwise
          # swallow its exit code), and grep for the distinctive help tagline
          # rather than "gmacko-ops" — the latter also appears in error output,
          # which previously let a broken CLI false-pass.
          set -o pipefail
          pnpm api:ops -- --help | tee /tmp/e2e-test/operator-help.log
          grep 'CLI + MCP wrappers over the same HTTP API' /tmp/e2e-test/operator-help.log || (echo "Operator CLI help did not render" && exit 1)
        working-directory: /tmp/e2e-test/test-app-operators

      - name: Verify bootstrap artifacts
        run: |
          test -f docs/ai/BOOTSTRAP_PLAYBOOK.md || (echo "Missing BOOTSTRAP_PLAYBOOK.md" && exit 1)
          test -f .claude/skills/bootstrap-saas/SKILL.md || (echo "Missing bootstrap-saas skill" && exit 1)
          grep '/office-hours' docs/ai/BOOTSTRAP_PLAYBOOK.md || (echo "Missing office-hours guidance" && exit 1)
          grep '/autoplan' docs/ai/BOOTSTRAP_PLAYBOOK.md || (echo "Missing autoplan guidance" && exit 1)
          grep '/design-consultation' docs/ai/BOOTSTRAP_PLAYBOOK.md || (echo "Missing design-consultation guidance" && exit 1)
          grep '"gmacko-app"' .mcp.json || (echo "Operator lane did not register the app MCP server" && exit 1)
        working-directory: /tmp/e2e-test/test-app-operators

      - name: Run fast checks
        run: pnpm check:fast
        working-directory: /tmp/e2e-test/test-app-operators

  e2e-minimal:
    name: E2E - Minimal (web only)
    needs: build-cli
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download CLI dist
        uses: actions/download-artifact@v4
        with:
          name: cli-dist
          path: packages/create-gmacko-app/dist

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install CLI dependencies
        run: pnpm install --frozen-lockfile

      - name: Scaffold minimal app
        run: |
          mkdir -p /tmp/e2e-test
          cd /tmp/e2e-test
          node ${{ github.workspace }}/packages/create-gmacko-app/dist/index.js test-app-minimal \
            --yes --no-git \
            --no-mobile --no-ai --prune \
            --integrations ""
        env:
          CI: "true"

      - name: Create mock .env
        run: printf '%s' "$MOCK_ENV" > .env
        working-directory: /tmp/e2e-test/test-app-minimal

      - name: Verify structure
        run: |
          test -d apps/web || (echo "Missing apps/web" && exit 1)
          test ! -d apps/expo || (echo "apps/expo should not exist" && exit 1)
          test ! -d packages/analytics || (echo "packages/analytics should not exist" && exit 1)
          test ! -d packages/payments || (echo "packages/payments should not exist" && exit 1)
          echo "Structure verified!"
        working-directory: /tmp/e2e-test/test-app-minimal

      - name: Run doctor
        run: pnpm run doctor
        working-directory: /tmp/e2e-test/test-app-minimal

      - name: Run fast checks
        run: pnpm check:fast
        working-directory: /tmp/e2e-test/test-app-minimal

      - name: Run web build
        run: pnpm --filter @gmacko/web build
        working-directory: /tmp/e2e-test/test-app-minimal

  e2e-custom-scope:
    name: E2E - Custom Package Scope
    needs: build-cli
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download CLI dist
        uses: actions/download-artifact@v4
        with:
          name: cli-dist
          path: packages/create-gmacko-app/dist

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install CLI dependencies
        run: pnpm install --frozen-lockfile

      - name: Scaffold with custom scope
        run: |
          mkdir -p /tmp/e2e-test
          cd /tmp/e2e-test
          node ${{ github.workspace }}/packages/create-gmacko-app/dist/index.js test-app-scope \
            --yes --no-git \
            --no-mobile --prune --operator-lane \
            --package-scope "@mycompany" \
            --integrations ""
        env:
          CI: "true"

      - name: Create mock .env
        run: printf '%s' "$MOCK_ENV" > .env
        working-directory: /tmp/e2e-test/test-app-scope

      - name: Verify package scope
        # The rename runs after every generator, so it must also have reached
        # the operator root scripts, .mcp.json, .forgegraph.yaml and the
        # generated workflows — not just the package.json names.
        run: |
          grep '"name": "@mycompany/api"' packages/api/package.json || (echo "Wrong scope in api" && exit 1)
          grep '"name": "@mycompany/domain"' packages/domain/package.json || (echo "Wrong scope in domain" && exit 1)
          grep '"name": "@mycompany/db"' packages/db/package.json || (echo "Wrong scope in db" && exit 1)
          grep '"name": "@mycompany/web"' apps/web/package.json || (echo "Wrong scope in web" && exit 1)
          grep '"@gmacko/emulate"' package.json || (echo "External @gmacko/emulate was renamed" && exit 1)
          grep '@mycompany/api-cli' package.json || (echo "api:ops kept the template scope" && exit 1)
          grep '@mycompany/mcp-server' package.json || (echo "mcp:app kept the template scope" && exit 1)
          grep '@mycompany/mcp-server' .mcp.json || (echo ".mcp.json kept the template scope" && exit 1)
          for f in .github/workflows/preview.yml .github/workflows/e2e.yml .github/workflows/sdk.yml .forgegraph.yaml; do
            grep -q '@mycompany/' "$f" || (echo "$f kept the template scope" && exit 1)
            if grep -q '@gmacko/' "$f"; then echo "$f still names @gmacko/" && exit 1; fi
          done
          echo "Package scope verified!"
        working-directory: /tmp/e2e-test/test-app-scope

      - name: Run doctor
        run: pnpm run doctor
        working-directory: /tmp/e2e-test/test-app-scope

      - name: Run fast checks
        run: pnpm check:fast
        working-directory: /tmp/e2e-test/test-app-scope

      - name: Run web build
        run: pnpm --filter @mycompany/web build
        working-directory: /tmp/e2e-test/test-app-scope

  e2e-full:
    name: E2E - Full Config
    needs: build-cli
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download CLI dist
        uses: actions/download-artifact@v4
        with:
          name: cli-dist
          path: packages/create-gmacko-app/dist

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install CLI dependencies
        run: pnpm install --frozen-lockfile

      - name: Scaffold full app
        run: |
          mkdir -p /tmp/e2e-test
          cd /tmp/e2e-test
          node ${{ github.workspace }}/packages/create-gmacko-app/dist/index.js test-app-full \
            --yes --no-git \
            --saas-bootstrap \
            --integrations "sentry,posthog,stripe,revenuecat,notifications,email,storage" \
            --email-provider resend
        env:
          CI: "true"

      - name: Create mock .env
        run: |
          printf '%s' "$MOCK_ENV" > .env
          cat >> .env << 'EOF'
          SENTRY_DSN="https://test@test.ingest.sentry.io/test"
          VITE_POSTHOG_KEY="phc_test"
          STRIPE_SECRET_KEY="sk_test_123"
          RESEND_API_KEY="re_test_123"
          EOF
        working-directory: /tmp/e2e-test/test-app-full

      - name: Verify structure
        run: |
          test -d apps/web || (echo "Missing apps/web" && exit 1)
          test -d apps/expo || (echo "Missing apps/expo" && exit 1)
          test -d packages/monitoring || (echo "Missing packages/monitoring" && exit 1)
          test -d packages/analytics || (echo "Missing packages/analytics" && exit 1)
          test -d packages/payments || (echo "Missing packages/payments" && exit 1)
          test -d packages/email || (echo "Missing packages/email" && exit 1)
          test -d packages/storage || (echo "Missing packages/storage" && exit 1)
          echo "Structure verified!"
        working-directory: /tmp/e2e-test/test-app-full

      - name: Run doctor
        run: pnpm run doctor
        working-directory: /tmp/e2e-test/test-app-full

      - name: Run fast checks
        run: pnpm check:fast
        working-directory: /tmp/e2e-test/test-app-full

      - name: Run web build
        run: pnpm --filter @gmacko/web build
        working-directory: /tmp/e2e-test/test-app-full

      - name: Run Expo typecheck
        run: pnpm --filter @gmacko/expo typecheck
        working-directory: /tmp/e2e-test/test-app-full

      - name: Run Expo dev-client smoke checks
        run: |
          pnpm --filter @gmacko/expo exec expo start --dev-client --help
          pnpm --filter @gmacko/expo exec expo config --json >/tmp/e2e-test/expo-config.json
          grep '"name"' /tmp/e2e-test/expo-config.json || (echo "Expo config did not resolve" && exit 1)
        working-directory: /tmp/e2e-test/test-app-full

  e2e-mobile-only:
    name: E2E - Mobile Only
    needs: build-cli
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download CLI dist
        uses: actions/download-artifact@v4
        with:
          name: cli-dist
          path: packages/create-gmacko-app/dist

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install CLI dependencies
        run: pnpm install --frozen-lockfile

      - name: Scaffold mobile-only app
        run: |
          mkdir -p /tmp/e2e-test
          cd /tmp/e2e-test
          node ${{ github.workspace }}/packages/create-gmacko-app/dist/index.js test-app-mobile \
            --yes --no-git --no-web --no-ai
        env:
          CI: "true"

      - name: Create mock .env
        run: printf '%s' "$MOCK_ENV" > .env
        working-directory: /tmp/e2e-test/test-app-mobile

      - name: Verify structure
        run: |
          test ! -d apps/web || (echo "apps/web should not exist" && exit 1)
          test -d apps/expo || (echo "Missing apps/expo" && exit 1)
          test ! -f .github/workflows/preview.yml || (echo "preview.yml should not exist without a web app" && exit 1)
          grep -q '"dev": "pnpm dev:emulate"' package.json || (echo "dev script should only start emulate" && exit 1)
          echo "Structure verified!"
        working-directory: /tmp/e2e-test/test-app-mobile

      - name: Run doctor
        run: |
          pnpm run doctor | tee /tmp/e2e-test/mobile-doctor.log
          if grep 'Cloudflare Workers lane detected' /tmp/e2e-test/mobile-doctor.log; then
            echo "Doctor detected a Workers lane in a mobile-only scaffold" && exit 1
          fi
        working-directory: /tmp/e2e-test/test-app-mobile

      - name: Run typecheck
        run: pnpm typecheck
        working-directory: /tmp/e2e-test/test-app-mobile

      - name: Run Expo typecheck
        run: pnpm --filter @gmacko/expo typecheck
        working-directory: /tmp/e2e-test/test-app-mobile

  e2e-mobile-pruned:
    name: E2E - Mobile Only, Pruned
    needs: build-cli
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download CLI dist
        uses: actions/download-artifact@v4
        with:
          name: cli-dist
          path: packages/create-gmacko-app/dist

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install CLI dependencies
        run: pnpm install --frozen-lockfile

      - name: Scaffold pruned mobile-only app
        run: |
          mkdir -p /tmp/e2e-test
          cd /tmp/e2e-test
          node ${{ github.workspace }}/packages/create-gmacko-app/dist/index.js test-app-mobile-pruned \
            --yes --no-git \
            --no-web --no-ai --prune \
            --integrations ""
        env:
          CI: "true"

      - name: Create mock .env
        run: printf '%s' "$MOCK_ENV" > .env
        working-directory: /tmp/e2e-test/test-app-mobile-pruned

      - name: Verify nothing imports the pruned packages
        # Pruning with Expo kept used to leave dangling
        # @gmacko/analytics/native and @gmacko/monitoring/native imports.
        run: |
          test ! -d apps/web || (echo "apps/web should not exist" && exit 1)
          test ! -d packages/analytics || (echo "packages/analytics should not exist" && exit 1)
          test ! -d packages/monitoring || (echo "packages/monitoring should not exist" && exit 1)
          if grep -q '@gmacko/analytics' apps/expo/src/providers.tsx; then echo "providers.tsx still imports the pruned analytics package" && exit 1; fi
          if grep -q '@gmacko/monitoring' apps/expo/src/providers.tsx; then echo "providers.tsx still imports the pruned monitoring package" && exit 1; fi
          if grep -q '@gmacko/monitoring' apps/expo/src/components/error-boundary.tsx; then echo "error-boundary.tsx still imports the pruned monitoring package" && exit 1; fi
          if grep -q 'db:migrate:local' package.json; then echo "D1 scripts survived removeWebApp" && exit 1; fi
          echo "Prune verified!"
        working-directory: /tmp/e2e-test/test-app-mobile-pruned

      - name: Run typecheck
        run: pnpm typecheck
        working-directory: /tmp/e2e-test/test-app-mobile-pruned

  report:
    name: Report Results
    needs: [e2e-default, e2e-operators, e2e-minimal, e2e-custom-scope, e2e-full, e2e-mobile-only, e2e-mobile-pruned]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check results
        run: |
          echo "## CLI E2E Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.e2e-default.result }}" == "success" ]; then
            echo "- :white_check_mark: Default (web + mobile)" >> $GITHUB_STEP_SUMMARY
          else
            echo "- :x: Default (web + mobile)" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ needs.e2e-operators.result }}" == "success" ]; then
            echo "- :white_check_mark: Operator lane" >> $GITHUB_STEP_SUMMARY
          else
            echo "- :x: Operator lane" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ needs.e2e-minimal.result }}" == "success" ]; then
            echo "- :white_check_mark: Minimal (web only)" >> $GITHUB_STEP_SUMMARY
          else
            echo "- :x: Minimal (web only)" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ needs.e2e-custom-scope.result }}" == "success" ]; then
            echo "- :white_check_mark: Custom package scope" >> $GITHUB_STEP_SUMMARY
          else
            echo "- :x: Custom package scope" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ needs.e2e-full.result }}" == "success" ]; then
            echo "- :white_check_mark: Full configuration" >> $GITHUB_STEP_SUMMARY
          else
            echo "- :x: Full configuration" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ needs.e2e-mobile-only.result }}" == "success" ]; then
            echo "- :white_check_mark: Mobile only" >> $GITHUB_STEP_SUMMARY
          else
            echo "- :x: Mobile only" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ needs.e2e-mobile-pruned.result }}" == "success" ]; then
            echo "- :white_check_mark: Mobile only, pruned" >> $GITHUB_STEP_SUMMARY
          else
            echo "- :x: Mobile only, pruned" >> $GITHUB_STEP_SUMMARY
          fi

          # Fail if any test failed
          if [ "${{ needs.e2e-default.result }}" != "success" ] || \
             [ "${{ needs.e2e-operators.result }}" != "success" ] || \
             [ "${{ needs.e2e-minimal.result }}" != "success" ] || \
             [ "${{ needs.e2e-custom-scope.result }}" != "success" ] || \
             [ "${{ needs.e2e-full.result }}" != "success" ] || \
             [ "${{ needs.e2e-mobile-only.result }}" != "success" ] || \
             [ "${{ needs.e2e-mobile-pruned.result }}" != "success" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Some E2E tests failed!**" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**All E2E tests passed!** :tada:" >> $GITHUB_STEP_SUMMARY

  e2e-vitest-on-demand:
    name: E2E - Full Vitest Suite
    if: github.event_name == 'workflow_dispatch'
    needs: build-cli
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run full CLI E2E vitest suite
        run: pnpm --dir packages/create-gmacko-app exec vitest run src/__tests__/e2e.test.ts
        env:
          RUN_E2E: "true"
          # The suite builds several Vite/Workers apps; cap the V8 heap so the
          # child build processes do not OOM the runner.
          NODE_OPTIONS: "--max-old-space-size=8192"
          KEEP_TEST_APPS: ${{ inputs.keep_test_apps && 'true' || 'false' }}
