# Deploy workflow for ForgeGraph's cloudflare-workers target.
#
# `forge init` scaffolds a generic "cd to the wrangler config, pnpm build,
# npx wrangler deploy" workflow; this one replaces it so the stage sequence
# is migrate-then-deploy (scripts/deploy-stage.mjs) and a failed migration
# aborts the deploy. Copy it to `.forgejo/workflows/deploy.yml` in the
# ForgeGraph-managed repo (or point `forge init` at it). CLOUDFLARE_API_TOKEN
# and CLOUDFLARE_ACCOUNT_ID are provisioned by ForgeGraph from the workspace
# Cloudflare integration; FG_STAGE is set per deploy.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      stage:
        description: "Stage to deploy (staging | production)"
        default: staging

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      FG_STAGE: ${{ inputs.stage || vars.FG_STAGE || 'staging' }}
    steps:
      - uses: actions/checkout@v4
      - uses: https://github.com/pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Migrate the stage's D1, then deploy the Worker
        run: |
          set -eo pipefail
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN secret is not set" >&2
            exit 1
          fi
          node scripts/deploy-stage.mjs --stage "$FG_STAGE"
      - name: Health
        run: |
          URL="${{ vars.HEALTH_URL }}"
          if [ -n "$URL" ]; then curl -fsS "$URL/.well-known/forge-health"; fi
