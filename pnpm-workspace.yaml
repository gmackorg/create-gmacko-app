packages:
  - apps/*
  - packages/*
  - tooling/*
  - sdks/openapi

catalog:
  '@biomejs/biome': ^2.4.8
  '@cloudflare/vite-plugin': 1.54.3
  '@cloudflare/vitest-pool-workers': 0.22.0
  '@cloudflare/workers-types': 5.20260903.1
  '@sentry/cloudflare': 10.73.0
  '@better-auth/expo': 1.7.2
  '@commitlint/cli': ^20.5.0
  '@commitlint/config-conventional': ^20.5.0
  '@effect/sql-d1': 4.0.0-rc.112
  '@effect/sql-sqlite-node': 4.0.0-rc.112
  '@storybook/addon-a11y': ^10.3.0
  '@storybook/addon-docs': ^10.3.0
  '@storybook/nextjs-vite': ^10.3.0
  '@tailwindcss/postcss': ^4.2.2
  '@tailwindcss/vite': ^4.2.2
  '@tanstack/react-form': ^1.28.5
  '@tanstack/react-query': ^5.102.0
  '@tanstack/react-router': 1.170.32
  '@tanstack/react-router-devtools': 1.167.1
  '@tanstack/react-router-ssr-query': 1.167.2
  '@tanstack/react-start': 1.168.49
  '@trpc/client': ^11.13.4
  '@trpc/server': ^11.13.4
  '@trpc/tanstack-react-query': ^11.13.4
  '@types/node': ^25.5.0
  '@vitejs/plugin-react': 6.0.1
  # better-auth 1.7.2 is the first published release with the generic OAuth
  # rewrite (providers as first-class social providers); replaces the expired
  # pkg.pr.new pin of the unmerged endpoint-override PR #8814.
  better-auth: 1.7.2
  # drizzle 1.0 rc5 is the first line that compiles against effect rc.108+
  # (rc.4 still calls the removed Schema.TaggedErrorClass). Pin exact builds.
  drizzle-kit: 1.0.0-rc.5-ab785fc
  drizzle-orm: 1.0.0-rc.5-169397b
  effect: 4.0.0-rc.112
  knip: ^6.0.4
  lefthook: ^2.1.4
  oxlint: ^1.56.0
  storybook: ^10.3.0
  superjson: 2.2.6
  tailwindcss: ^4.2.2
  typescript: ^5.9.3
  vite: 8.0.0
  wrangler: 4.128.0
  zod: ^4.3.6

catalogs:
  react19:
    '@types/react': ^19.2.14
    '@types/react-dom': ^19.2.3
    react: ^19.2.4
    react-dom: ^19.2.4

linkWorkspacePackages: true

onlyBuiltDependencies:
  - '@tailwindcss/oxide'
  - esbuild
  - protobufjs

overrides:
  '@types/minimatch': 5.1.2
  lightningcss: 1.30.1
  # Collapse Expo SDK version skew onto SDK 56 canonical. Packages that don't
  # declare expo directly (analytics/i18n/notifications, and purchases via
  # react-native-purchases) otherwise resolve stale expo@54/55 + emc, which
  # breaks expo-notifications' permission types and risks native build skew.
  expo: 56.0.18
  expo-modules-core: 56.0.22
  react-native: 0.85.3
  # Transitive native modules that resolved below SDK-56 canonical and fail to
  # compile against RN 0.85.3 (react-native-svg's RCTImageResponseObserverProxy
  # C++ API changed; expo-image 55 predates RN 0.85).
  react-native-svg: 15.15.4
  expo-image: 56.0.11
  # Kill the residual Expo SDK-55 family that Expo autolinking otherwise
  # compiles into apps/expo (each 55.x native module fails vs RN 0.85.3).
  "@expo/cli": 56.1.22
  "@expo/config-plugins": 56.0.14
  "@expo/config-types": 56.0.7
  "@expo/config": 56.0.13
  "@expo/devtools": 56.0.2
  "@expo/dom-webview": 56.0.6
  "@expo/local-build-cache-provider": 56.0.11
  "@expo/log-box": 56.0.14
  "@expo/metro-config": 56.0.18
  "@expo/metro-runtime": 56.0.18
  "@expo/prebuild-config": 56.0.21
  "@expo/require-utils": 56.1.6
  "@expo/router-server": 56.0.17
  "@expo/schema-utils": 56.0.2
  expo-apple-authentication: 56.0.4
  expo-application: 56.0.3
  expo-asset: 56.0.21
  expo-clipboard: 56.0.4
  expo-constants: 56.0.22
  expo-dev-client: 56.0.24
  expo-dev-launcher: 56.0.25
  expo-dev-menu-interface: 56.0.1
  expo-dev-menu: 56.0.21
  expo-device: 56.0.4
  expo-file-system: 56.0.8
  expo-font: 56.0.7
  expo-glass-effect: 56.0.4
  expo-json-utils: 56.0.0
  expo-keep-awake: 56.0.3
  expo-linking: 56.0.16
  expo-localization: 56.0.6
  expo-manifests: 56.0.4
  expo-modules-autolinking: 56.0.21
  expo-notifications: 56.0.22
  expo-router: 56.2.17
  expo-secure-store: 56.0.4
  expo-server: 56.0.5
  expo-splash-screen: 56.0.14
  expo-status-bar: 56.0.4
  expo-symbols: 56.0.6
  expo-system-ui: 56.0.5
  expo-web-browser: 56.0.6
  # Force patched versions of transitive deps with critical advisories
  # (GHSA arbitrary-code-exec / DoS / type-confusion). See deps.yml audit gate.
  protobufjs: '>=7.5.5'
  shell-quote: '>=1.8.4'
  tar: '>=7.5.19'
  seroval: '>=1.5.3'
