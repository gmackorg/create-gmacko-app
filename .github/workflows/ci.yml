name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # `pnpm lint` is `turbo run lint`, so it only reaches files inside a
      # workspace package. This sweeps the whole tree from the root config —
      # scripts/, turbo/generators, test/ and the root dotfiles included — and
      # is the same command the lefthook pre-commit hook runs.
      - name: Lint (root sweep, incl. anti-slop plugin rules)
        run: pnpm lint:ox

      - name: Format check
        run: pnpm format

      - name: App standards
        run: pnpm check:standards

      - name: App standards rules (fixture tests)
        run: pnpm test:standards

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck

      # `wrangler types` needs no Cloudflare auth; the committed
      # apps/web/worker-configuration.d.ts must match wrangler.jsonc so the
      # Env type the runtime is compiled against is the one deployed.
      - name: Worker types are current
        run: pnpm check:cf-types

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      # The same Database suite against a real local D1 (Miniflare/workerd via
      # @cloudflare/vitest-pool-workers); catches D1-only divergence that the
      # sqlite-node suite cannot.
      - name: Run Workers tests
        run: pnpm test:workers

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            packages/*/coverage
          retention-days: 7

  fault:
    name: Fault Injection
    runs-on: ubuntu-latest
    # A bounded depth-1 pass: every declared perturbation on its own, against
    # the real Worker code on workerd with a real Miniflare D1. Pairs and
    # deeper combinations are the scheduled job's business
    # (.github/workflows/fault.yml), because the scenario count grows
    # combinatorially and a PR gate has to stay under a couple of minutes.
    #
    # Budget: 10 minutes. Today the search itself is ~150ms and the job is
    # install plus workerd startup (~2 minutes); the headroom is for the
    # scenarios that have not been written yet. If this job starts using it,
    # split scenarios across a matrix rather than dropping the depth.
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Reports the lane unavailable and exits 0 until `@gmacko/cloudfault`
      # is on npm and listed in apps/web/package.json. Set
      # CLOUDFAULT_REQUIRED=1 in the same commit that adds the dependency, so
      # a missing package becomes a failure instead of a silent skip.
      # See docs/FAULT_TESTING.md.
      - name: Run fault scenarios (depth 1)
        run: pnpm test:fault
        env:
          CLOUDFAULT_DEPTH: 1
          CLOUDFAULT_REQUIRED: 0

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          SKIP_ENV_VALIDATION: true
