name: SDK Generation

on:
  push:
    branches: [main]
    paths:
      - "packages/domain/**"
      - "sdks/openapi/**"
      - "sdks/contract/**"
      - "tooling/openapi-generator/**"
      - ".github/workflows/sdk.yml"
  pull_request:
    branches: [main]
    paths:
      - "packages/domain/**"
      - "sdks/openapi/**"
      - "sdks/contract/**"
      - "tooling/openapi-generator/**"
      - ".github/workflows/sdk.yml"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      languages:
        description: "Languages to generate (comma-separated, or 'all')"
        required: false
        default: "typescript,python"

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

jobs:
  generate-spec:
    name: Generate OpenAPI Spec
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate OpenAPI spec
        # OpenApi.fromApi(AppApi) over @gmacko/domain: the contract's own
        # package version is the spec version.
        run: pnpm -F @gmacko/openapi-spec generate

      - name: Upload spec artifact
        uses: actions/upload-artifact@v4
        with:
          name: openapi-spec
          path: sdks/openapi/openapi.json
          # Fail loudly if the spec wasn't generated (the default `warn` let an
          # empty upload pass, which then broke every downstream download).
          if-no-files-found: error

      - name: Check for spec drift (PR only)
        # The generated document must be byte-identical to the snapshot the
        # domain contract tests pin, so the SDKs describe exactly the API the
        # tests ran against. Update it with `pnpm -F @gmacko/domain test -- -u`.
        if: github.event_name == 'pull_request'
        run: |
          diff -u packages/domain/src/__tests__/__snapshots__/openapi.json sdks/openapi/openapi.json || {
            echo "::error::OpenAPI spec drifted from packages/domain's snapshot. Run 'pnpm -F @gmacko/domain test -- -u' and commit the snapshot."
            exit 1
          }

      - name: Generate ForgeGraph contract
        # compileHttpApi(AppApi) from @forgegraph/contract: stable operation
        # ids, SLA with provenance, IsPublic and derived authentication.
        run: pnpm -F @gmacko/contract-spec generate

      - name: Upload contract artifact
        uses: actions/upload-artifact@v4
        with:
          name: forgegraph-contract
          path: sdks/contract/contract.json
          if-no-files-found: error

      - name: Check for contract drift (PR only)
        if: github.event_name == 'pull_request'
        run: |
          diff -u packages/domain/src/__tests__/__snapshots__/contract.json sdks/contract/contract.json || {
            echo "::error::ForgeGraph contract drifted from packages/domain's snapshot. Run 'pnpm -F @gmacko/domain test -- -u' and commit the snapshot."
            exit 1
          }

      - name: Publish the contract to ForgeGraph
        # Records the contract against this commit and satisfies the
        # api_contract gate on the changeset.
        #
        # The guard is in the shell, not an `if:` expression: a step-level
        # `if` cannot see that step's own `env`, and Forgejo Actions supports
        # only a subset of expressions. A repo without the secret (a fork, or
        # one where `forge ci provision` has not run) is a setup state, not a
        # broken build, so it skips rather than fails.
        #
        # `forge ci provision` writes the secret as FORGEGRAPH_TOKEN; the CLI
        # reads FG_API_TOKEN. The server comes from .forgegraph.yaml.
        env:
          FG_API_TOKEN: ${{ secrets.FORGEGRAPH_TOKEN }}
        run: |
          if [ -z "${FG_API_TOKEN:-}" ]; then
            echo "No FORGEGRAPH_TOKEN secret — skipping the contract publish."
            exit 0
          fi
          pnpm exec forge contract publish

  generate-sdks:
    name: Generate SDKs
    needs: generate-spec
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [typescript, python, go, java, kotlin, swift, rust, ruby]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Setup Java (for openapi-generator)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Download OpenAPI spec
        uses: actions/download-artifact@v4
        with:
          name: openapi-spec
          path: sdks/openapi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: tooling/openapi-generator

      - name: Generate SDK
        run: pnpm generate --language ${{ matrix.language }}
        working-directory: tooling/openapi-generator

      - name: Upload SDK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sdk-${{ matrix.language }}
          path: sdks/generated/${{ matrix.language }}

  publish-sdks:
    name: Publish SDKs
    needs: generate-sdks
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all SDK artifacts
        uses: actions/download-artifact@v4
        with:
          path: sdks/generated
          pattern: sdk-*
          merge-multiple: true

      - name: Setup Python (for PyPI publish)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Publish Python SDK to PyPI
        if: vars.PUBLISH_PYPI == 'true'
        run: |
          cd sdks/generated/python
          pip install build twine
          python -m build
          twine upload dist/*
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}

      - name: Setup Go (for Go module)
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Tag Go SDK
        if: vars.PUBLISH_GO == 'true'
        run: |
          cd sdks/generated/go
          git tag go/v${{ github.event.release.tag_name }}
          git push origin go/v${{ github.event.release.tag_name }}

      - name: Create GitHub Release assets
        uses: softprops/action-gh-release@v1
        with:
          files: |
            sdks/generated/*/README.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
