name: Forge API

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: forgec 0.5.0
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install forgec 0.5.0
        run: |
          curl -fsSL -o forgec.tar.gz https://github.com/gmackie/forgec/releases/download/v0.5.0/forgec-0.5.0-x86_64-unknown-linux-gnu.tar.gz
          echo "683854945966686d7f6080e518a292b5dbc5eca3915a4b0e3e148a4a3a27601f  forgec.tar.gz" | sha256sum -c -
          tar xzf forgec.tar.gz
          install -m 755 "$(find . -name forgec -type f | head -1)" /usr/local/bin/forgec
          forgec --version

      - name: Check and build the product API
        run: |
          forgec check forge
          forgec build forge --out forge/generated --service-id gmacko
          python3 - << 'PY'
          import json
          spec = json.load(open("forge/generated/openapi.json"))
          paths = set(spec["paths"])
          need = {
              "/v1/customers",
              "/v1/customers/{id}",
              "/v1/integrations/notify",
              "/v1/posts",
              "/v1/posts/{id}",
          }
          missing = need - paths
          if missing:
              raise SystemExit(f"missing paths: {sorted(missing)}")
          notify = spec["paths"]["/v1/integrations/notify"]["post"]["requestBody"]
          body = notify["content"]["application/json"]["schema"]
          required = set(body["required"])
          if required != {"customer", "event"}:
              raise SystemExit(f"notify body required {sorted(required)}")
          post = spec["paths"]["/v1/posts"]["post"]["requestBody"]
          post_body = post["content"]["application/json"]["schema"]
          # CRUD bodies are component refs. Notify stays inline.
          ref = post_body.get("$ref")
          if ref:
              post_body = spec["components"]["schemas"][ref.rsplit("/", 1)[-1]]
          if set(post_body["required"]) != {"title", "content"}:
              raise SystemExit(f"post body required {sorted(post_body['required'])}")
          print("product API ok")
          PY
          cp forge/generated/app.json apps/forge/src/app.json
          cp forge/generated/d1/0001_init.sql apps/forge/migrations/0001_init.sql
          git diff --exit-code -- apps/forge/src/app.json apps/forge/migrations/0001_init.sql
