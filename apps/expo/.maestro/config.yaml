# Maestro E2E Test Configuration
# https://maestro.mobile.dev/

# App configuration
appId: ${APP_ID:-com.gmacko.app}

# Flow settings
flows:
  - flows/*.yaml

# Environment variables (can be overridden via CLI)
# Test credentials must be supplied via env / CI secrets — no working defaults
# are committed. Run with: TEST_EMAIL=… TEST_PASSWORD=… maestro test …
env:
  API_URL: ${API_URL:-http://localhost:3000}
  TEST_EMAIL: ${TEST_EMAIL}
  TEST_PASSWORD: ${TEST_PASSWORD}

# Timeout settings (in milliseconds)
launchTimeout: 30000
waitTimeout: 10000

# Screenshots on failure
onFlowError:
  - takeScreenshot: error-${timestamp}
# Device configuration (optional)
# device:
#   platform: ios
#   model: iPhone 15
