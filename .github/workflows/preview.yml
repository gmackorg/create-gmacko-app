name: Preview Deploy

# A preview URL per pull request, as a *version* of the single
# `gmacko-web-preview` Worker (`wrangler versions upload`) rather than a
# Worker per PR. A version inherits that Worker's bindings and secrets, gets
# its own `https://<version-prefix>-gmacko-web-preview.<subdomain>.workers.dev`
# URL, and takes no production traffic until someone deploys it — so there is
# nothing to create and nothing to delete when the PR closes.
#
# Pending migrations are applied to the shared preview D1 first, in a step of
# its own; expand/contract (docs/drizzle-migrations.md) keeps that one
# database compatible with every open PR. Phase 9 gives each PR its own D1 —
# revisit this workflow then: a per-PR database cannot be a binding on the
# shared Worker, so previews would go back to a Worker (or a dispatch
# namespace) per PR, and the close job would come back with it.
#
# `wrangler versions upload` is run through `pnpm -F @gmacko/web
# preview:upload` = `CLOUDFLARE_ENV=preview vite build && wrangler versions
# upload`, the same shape as the `deploy:<stage>` scripts: the Cloudflare Vite
# plugin resolves `env.preview` from wrangler.jsonc at build time and emits a
# flat config, so wrangler is not given `--env` a second time.
#
# Needs the CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID secrets. Preview URLs
# must be enabled for the Worker (they are by default).

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  # Never cancel a run in flight: it may be inside `migrate:remote` against
  # the shared preview D1, and a half-applied migration is not something a
  # rerun can reason about.
  cancel-in-progress: false

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  preview:
    name: Upload preview version
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Skip without Cloudflare credentials
        id: creds
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN is not set; skipping the preview upload"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply pending migrations to the shared preview D1
        if: steps.creds.outputs.ok == 'true'
        run: pnpm -F @gmacko/db migrate:remote --env preview

      - name: Upload a preview version of gmacko-web-preview
        id: upload
        if: steps.creds.outputs.ok == 'true'
        env:
          VITE_POSTHOG_KEY: ${{ vars.PREVIEW_POSTHOG_KEY }}
          VITE_SENTRY_DSN: ${{ vars.PREVIEW_SENTRY_DSN }}
        run: |
          set -o pipefail
          pnpm -F @gmacko/web preview:upload | tee /tmp/versions-upload.log
          url="$(grep -oE 'https://[A-Za-z0-9.-]+\.workers\.dev' /tmp/versions-upload.log | head -n1)"
          version="$(grep -oE '[0-9a-f-]{36}' /tmp/versions-upload.log | head -n1)"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ -z "$url" ]; then
            echo "::warning::wrangler did not print a version preview URL; enable preview URLs for the Worker"
          fi

      - name: Comment the preview URL
        if: steps.creds.outputs.ok == 'true'
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.upload.outputs.url }}
          VERSION_ID: ${{ steps.upload.outputs.version }}
        with:
          script: |
            const url = process.env.PREVIEW_URL;
            const version = process.env.VERSION_ID || '(unknown)';
            const link = url || '(preview URLs are not enabled for `gmacko-web-preview`)';
            const sha = '${{ github.event.pull_request.head.sha }}'.slice(0, 7);
            const body = `## Preview deploy

            | Field | Value |
            |------|-------|
            | Worker | \`gmacko-web-preview\` (version, not deployed) |
            | Version | \`${version}\` |
            | URL | ${link} |
            | Commit | \`${sha}\` |
            | Database | shared \`gmacko-web-preview\` D1 (per-PR databases: Phase 9) |

            Health: ${url ? `${url}/.well-known/forge-health` : "n/a"}
            `;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(
              (c) => c.user.type === 'Bot' && c.body.includes('## Preview deploy'),
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
