# ForgeGraph repo contract for the web lane (apps/web on Cloudflare Workers + D1).
# `forge diff` / `forge apply` sync this file with the server; `forge deploy
# create <stage> --wait` (pnpm forge:deploy:<stage>) runs the repo's deploy
# workflow for a cloudflare-workers target (deploy/forgegraph/deploy.yml).
#
# Deploy sequence per stage:
#   1. pnpm -F @gmacko/db migrate:remote --env <stage>   # D1 migrations, forward-only
#   2. pnpm -F @gmacko/web deploy:<stage>                # CLOUDFLARE_ENV=<stage> vite build && wrangler deploy
# scripts/deploy-stage.mjs is the single place that ordering lives: `pnpm
# deploy:<stage>` and deploy/forgegraph/deploy.yml both run it once and it
# does 1 then 2. ForgeGraph's own stage machinery runs the two halves
# separately — `db.migrate` below is step 1 (deploy-stage.mjs --migrate-only)
# and each target's `deploy` is step 2 alone — so a stage is migrated exactly
# once either way. A failing migration aborts the deploy. Migrations are
# expand/contract only (docs/drizzle-migrations.md): a release may add
# columns, tables and indexes; it drops or renames one release after nothing
# deployed reads them.
#
# D1 is NOT provisioned by `forge db create` (that creates Postgres on a node
# and a Hyperdrive). Create the databases once with wrangler and put their ids
# in apps/web/wrangler.jsonc (`env.<stage>.d1_databases`):
#   pnpm -F @gmacko/web exec wrangler d1 create gmacko-web-staging
#   pnpm -F @gmacko/web exec wrangler d1 create gmacko-web
#   pnpm -F @gmacko/web exec wrangler d1 create gmacko-web-preview   # shared by PR previews until Phase 9
# Stage secrets live in ForgeGraph (`forge secret set KEY --stage <stage>`)
# and reach the Worker with `pnpm secrets:push --stage <stage>`.

app: gmacko
server: https://forgegraf.com

db:
  type: d1
  name: gmacko-web
  # Run by ForgeGraph before the deploy step; FG_STAGE selects the stage.
  migrate: node scripts/deploy-stage.mjs --migrate-only
  migrateType: wrangler

stages:
  - name: staging
    sortOrder: 10
    targets:
      - name: web
        platform: cloudflare-workers
        config:
          workerName: gmacko-web-staging
          configPath: apps/web/wrangler.jsonc
          environment: staging
          deploy: pnpm -F @gmacko/web deploy:staging
  - name: production
    sortOrder: 20
    targets:
      - name: web
        platform: cloudflare-workers
        config:
          workerName: gmacko-web
          configPath: apps/web/wrangler.jsonc
          environment: production
          deploy: pnpm -F @gmacko/web deploy:production

resources:
  d1:
    - name: gmacko-web-staging
      binding: DB
    - name: gmacko-web
      binding: DB
    - name: gmacko-web-preview
      binding: DB

health:
  # Served by the Worker (packages/api HealthApi); stage-based redaction, no internals in production.
  url: /.well-known/forge-health
  interval: 60
  timeout: 10

# ForgeGraph operator notes:
# primary web service path: apps/web
# healthcheck path: /.well-known/forge-health
# database strategy: cloudflare-d1 (per stage; previews share gmacko-web-preview)
# preview domain: change-me.preview.example.com
# production domain: change-me.example.com
