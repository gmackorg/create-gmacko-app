name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - "apps/nextjs/**"
      - "apps/expo/**"
      - "packages/legacy-api/**"
      - "packages/legacy-auth/**"
      - "packages/legacy-db/**"
      - "packages/ui/**"
      - ".github/workflows/e2e.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

jobs:
  e2e-web:
    name: Web E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        # playwright.config.ts defines chromium, firefox, webkit, mobile-chrome
        # (Pixel 5 / chromium) and mobile-safari (iPhone 12 / webkit). Install all
        # three engines so every configured project can launch (webkit was missing,
        # failing the mobile-safari/webkit projects).
        run: pnpm -F @gmacko/nextjs exec playwright install --with-deps chromium firefox webkit

      - name: Build application
        run: pnpm build
        env:
          SKIP_ENV_VALIDATION: true
          DATABASE_URL: "postgresql://test:test@localhost:5432/test"
          AUTH_SECRET: "test-secret-for-ci-builds"

      # Create the schema in the service Postgres so the app's session/auth
      # queries succeed when Playwright drives it (pages otherwise 500).
      - name: Push database schema
        run: pnpm db:legacy:push --force
        env:
          DATABASE_URL: "postgresql://test:test@localhost:5432/test"

      - name: Run E2E tests
        # Run Playwright directly (not via `turbo run e2e`) so the webServer's
        # stdout/stderr streams to the log and the full step env reaches the
        # `next start` process without turbo's env filtering.
        run: pnpm -F @gmacko/nextjs exec playwright test
        env:
          CI: true
          PLAYWRIGHT_BASE_URL: "http://localhost:3000"
          DATABASE_URL: "postgresql://test:test@localhost:5432/test"
          AUTH_SECRET: "test-secret-for-ci-builds"
          SKIP_ENV_VALIDATION: "true"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/nextjs/playwright-report
          retention-days: 7

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: apps/nextjs/test-results
          retention-days: 7

  e2e-mobile:
    name: Mobile E2E Tests (Maestro)
    runs-on: macos-latest
    timeout-minutes: 45
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'run-mobile-e2e')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install Maestro
        run: |
          # `brew install maestro` installs the Maestro.app CASK and leaves no
          # `maestro` CLI on PATH (exit 127). Use the official installer, which
          # drops the CLI in ~/.maestro/bin.
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
          "$HOME/.maestro/bin/maestro" --version

      - name: Build iOS app
        run: |
          cd apps/expo
          npx expo prebuild --platform ios --clean
          # `ls -d` yields the workspace directory itself; a bare `ls` lists its
          # CONTENTS and picks up `contents.xcworkspacedata`, producing a bogus
          # scheme. The Expo scheme matches the workspace basename.
          WORKSPACE=$(ls -d ios/*.xcworkspace | head -1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          echo "Building workspace=$WORKSPACE scheme=$SCHEME"
          # `-sdk iphonesimulator` builds a generic simulator binary without
          # pinning a specific device (device names vary by Xcode version).
          xcodebuild -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath build \
            build
        env:
          SKIP_ENV_VALIDATION: true

      - name: Boot iOS Simulator
        run: |
          # Pick the first available iPhone simulator by UDID rather than
          # hardcoding a device name (e.g. "iPhone 15" isn't present on every
          # Xcode version).
          DEVICE_ID=$(xcrun simctl list devices available \
            | grep 'iPhone' \
            | grep -oE '[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}' \
            | head -1)
          if [ -z "$DEVICE_ID" ]; then
            echo "No available iPhone simulator found"; xcrun simctl list devices; exit 1
          fi
          echo "SIMULATOR_ID=$DEVICE_ID" >> "$GITHUB_ENV"
          echo "Booting simulator $DEVICE_ID"
          xcrun simctl boot "$DEVICE_ID" || true
          xcrun simctl bootstatus "$DEVICE_ID" -b || true
          xcrun simctl list devices booted

      - name: Install app on Simulator
        run: |
          APP_PATH=$(find apps/expo/build -name "*.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "No .app bundle found under apps/expo/build"; find apps/expo/build -name "*.app"; exit 1
          fi
          echo "Installing $APP_PATH onto $SIMULATOR_ID"
          xcrun simctl install "$SIMULATOR_ID" "$APP_PATH"
          # Derive the actual bundle id from the built app rather than guessing:
          # a Debug build defaults to the dev variant (com.gmacko.app.dev), not
          # the production id, so a hardcoded APP_ID fails to launch.
          BUNDLE_ID=$(plutil -extract CFBundleIdentifier raw "$APP_PATH/Info.plist")
          echo "Installed bundle id: $BUNDLE_ID"
          echo "APP_ID=$BUNDLE_ID" >> "$GITHUB_ENV"

      - name: Run Maestro E2E tests
        run: |
          cd apps/expo
          # Run the app-launch smoke only: it verifies the app builds,
          # installs, and renders on the simulator. The auth/CRUD flows
          # (02/03/05) assert real content that needs a running backend at
          # API_URL — they stay in .maestro/flows for apps that wire one up,
          # but the template CI has no backend, so gating on them here would
          # be a false signal.
          # APP_ID comes from the installed app's Info.plist (set in the install
          # step); a single flow file doesn't read .maestro/config.yaml, so pass
          # it via -e or ${APP_ID} resolves to "undefined".
          maestro test -e APP_ID="${APP_ID}" .maestro/flows/01-app-launch.yaml
        env:
          API_URL: "http://localhost:3000"

      - name: Upload Maestro screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-screenshots
          path: ~/.maestro/screenshots/
          retention-days: 7
