name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout
        uses: https://git.forgegraf.com/gmackie/ci-actions/checkout@9681ef93e12f50014fd38c9b3eba320a87c8b80e

      - name: Setup pnpm
        uses: https://git.forgegraf.com/gmackie/ci-actions/setup-pnpm@9681ef93e12f50014fd38c9b3eba320a87c8b80e

      - name: Setup Node.js
        uses: https://git.forgegraf.com/gmackie/ci-actions/setup-node@9681ef93e12f50014fd38c9b3eba320a87c8b80e
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"
          registry-url: ${{ vars.NPM_REGISTRY_URL || 'https://registry.npmjs.org' }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run CLI tests
        run: pnpm --dir packages/create-gmacko-app test

      - name: Build CLI package
        run: pnpm --dir packages/create-gmacko-app build

      - name: Verify CLI publish tarball
        run: pnpm release:cli:dry-run

      - name: Create Forgejo release PR or publish packages
        run: node scripts/ci/forgejo.mjs release
        env:
          FORGEJO_SERVER_URL: ${{ github.server_url }}
          FORGEJO_REPOSITORY: ${{ github.repository }}
          FORGEJO_TOKEN: ${{ github.token }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
