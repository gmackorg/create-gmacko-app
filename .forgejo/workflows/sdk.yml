name: SDK Generation

on:
  push:
    branches: [main]
    paths:
      - "packages/domain/**"
      - "sdks/openapi/**"
      - "tooling/openapi-generator/**"
      # This file is listed so a shared install-gate fix re-runs generation.
      - ".forgejo/workflows/sdk.yml"
  pull_request:
    branches: [main]
    paths:
      - "packages/domain/**"
      - "sdks/openapi/**"
      - "tooling/openapi-generator/**"
      # This file is listed so a shared install-gate fix re-runs generation.
      - ".forgejo/workflows/sdk.yml"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      languages:
        description: "Languages to generate (comma-separated, or 'all')"
        required: false
        default: "typescript,python"

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

jobs:
  generate-spec:
    name: Generate OpenAPI Spec
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: https://git.forgegraf.com/gmackie/ci-actions/checkout@9681ef93e12f50014fd38c9b3eba320a87c8b80e

      - name: Setup pnpm
        uses: https://git.forgegraf.com/gmackie/ci-actions/setup-pnpm@9681ef93e12f50014fd38c9b3eba320a87c8b80e

      - name: Setup Node.js
        uses: https://git.forgegraf.com/gmackie/ci-actions/setup-node@9681ef93e12f50014fd38c9b3eba320a87c8b80e
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate OpenAPI spec
        # OpenApi.fromApi(AppApi) over @gmacko/domain: the contract's own
        # package version is the spec version.
        run: pnpm -F @gmacko/openapi-spec generate

      - name: Upload spec artifact
        # v4's artifact client is rejected by Forgejo (GHESNotSupportedError).
        uses: https://git.forgegraf.com/gmackie/ci-actions/upload-artifact@9681ef93e12f50014fd38c9b3eba320a87c8b80e
        with:
          name: openapi-spec
          path: sdks/openapi/openapi.json
          # Fail loudly if the spec wasn't generated (the default `warn` let an
          # empty upload pass, which then broke every downstream download).
          if-no-files-found: error

      - name: Check for spec drift (PR only)
        # The generated document must be byte-identical to the snapshot the
        # domain contract tests pin, so the SDKs describe exactly the API the
        # tests ran against. Update it with `pnpm -F @gmacko/domain test -- -u`.
        if: github.event_name == 'pull_request'
        run: |
          diff -u packages/domain/src/__tests__/__snapshots__/openapi.json sdks/openapi/openapi.json || {
            echo "::error::OpenAPI spec drifted from packages/domain's snapshot. Run 'pnpm -F @gmacko/domain test -- -u' and commit the snapshot."
            exit 1
          }

  generate-sdks:
    name: Generate SDKs
    needs: generate-spec
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        language: [typescript, python, go, java, kotlin, swift, rust, ruby]
    steps:
      - name: Checkout
        uses: https://git.forgegraf.com/gmackie/ci-actions/checkout@9681ef93e12f50014fd38c9b3eba320a87c8b80e

      - name: Setup pnpm
        uses: https://git.forgegraf.com/gmackie/ci-actions/setup-pnpm@9681ef93e12f50014fd38c9b3eba320a87c8b80e

      - name: Setup Node.js
        uses: https://git.forgegraf.com/gmackie/ci-actions/setup-node@9681ef93e12f50014fd38c9b3eba320a87c8b80e
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Setup Java (for openapi-generator)
        uses: https://git.forgegraf.com/gmackie/ci-actions/setup-java@9681ef93e12f50014fd38c9b3eba320a87c8b80e
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Download OpenAPI spec
        # v4's artifact client is rejected by Forgejo (GHESNotSupportedError).
        uses: https://git.forgegraf.com/gmackie/ci-actions/download-artifact@9681ef93e12f50014fd38c9b3eba320a87c8b80e
        with:
          name: openapi-spec
          path: sdks/openapi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: tooling/openapi-generator

      - name: Generate SDK
        run: pnpm generate --language ${{ matrix.language }}
        working-directory: tooling/openapi-generator

      - name: Upload SDK artifact
        # v4's artifact client is rejected by Forgejo (GHESNotSupportedError).
        uses: https://git.forgegraf.com/gmackie/ci-actions/upload-artifact@9681ef93e12f50014fd38c9b3eba320a87c8b80e
        with:
          name: sdk-${{ matrix.language }}
          path: sdks/generated/${{ matrix.language }}

  publish-sdks:
    name: Publish SDKs
    needs: generate-sdks
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: https://git.forgegraf.com/gmackie/ci-actions/checkout@9681ef93e12f50014fd38c9b3eba320a87c8b80e

      - name: Download all SDK artifacts
        uses: https://git.forgegraf.com/gmackie/ci-actions/download-artifact@9681ef93e12f50014fd38c9b3eba320a87c8b80e
        with:
          path: sdks/generated

      - name: Restore SDK directories
        run: |
          for artifact in sdks/generated/sdk-*; do
            language="${artifact##*/sdk-}"
            mv "$artifact" "sdks/generated/$language"
          done

      - name: Setup Python (for PyPI publish)
        uses: https://git.forgegraf.com/gmackie/ci-actions/setup-python@9681ef93e12f50014fd38c9b3eba320a87c8b80e
        with:
          python-version: "3.11"

      - name: Publish Python SDK to PyPI
        if: vars.PUBLISH_PYPI == 'true'
        run: |
          cd sdks/generated/python
          pip install build twine
          python -m build
          twine upload dist/*
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}

      - name: Setup Go (for Go module)
        uses: https://git.forgegraf.com/gmackie/ci-actions/setup-go@9681ef93e12f50014fd38c9b3eba320a87c8b80e
        with:
          go-version: "1.22"

      - name: Tag Go SDK
        if: vars.PUBLISH_GO == 'true'
        run: |
          cd sdks/generated/go
          git tag go/v${{ github.event.release.tag_name }}
          git push origin go/v${{ github.event.release.tag_name }}

      - name: Attach SDK assets to Forgejo release
        run: node scripts/ci/forgejo.mjs release-assets
        env:
          FORGEJO_SERVER_URL: ${{ github.server_url }}
          FORGEJO_REPOSITORY: ${{ github.repository }}
          FORGEJO_TOKEN: ${{ github.token }}
          FORGEJO_RELEASE_TAG: ${{ github.event.release.tag_name }}
